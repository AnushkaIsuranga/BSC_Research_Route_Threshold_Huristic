services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ${POSTGRES_CONTAINER_NAME:-vector_db}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vector_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./sql/schema_setup.sql:/docker-entrypoint-initdb.d/01_schema_setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vector_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
